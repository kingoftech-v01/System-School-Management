{% comment %}
Grade Distribution Bar Chart (ApexCharts)
Context variables:
  - grade_labels: JSON list of grade letters, e.g. ["A", "B", "C", "D", "F"]
  - grade_counts: JSON list of counts per grade
  - chart_id: unique DOM id (default: "grade-distribution-chart")
{% endcomment %}
<div class="card">
    <div class="card-header border-0 pb-0">
        <h4 class="heading mb-0">Grade Distribution</h4>
    </div>
    <div class="card-body">
        <div id="{{ chart_id|default:'grade-distribution-chart' }}" style="min-height: 300px;"></div>
    </div>
</div>

<script>
(function() {
    var labels = {{ grade_labels|safe }};
    var counts = {{ grade_counts|safe }};
    var total = counts.reduce(function(a, b) { return a + b; }, 0);
    if (total === 0) {
        document.getElementById("{{ chart_id|default:'grade-distribution-chart' }}").innerHTML =
            '<div class="text-center text-muted py-5">No grade data available.</div>';
        return;
    }
    var options = {
        chart: { type: 'bar', height: 300, toolbar: { show: false } },
        series: [{ name: 'Students', data: counts }],
        xaxis: { categories: labels },
        yaxis: { title: { text: 'Number of Students' } },
        colors: ['#4e73df'],
        plotOptions: {
            bar: {
                distributed: true,
                columnWidth: '50%',
                dataLabels: { position: 'top' }
            }
        },
        dataLabels: {
            enabled: true, offsetY: -20,
            style: { fontSize: '12px', colors: ['#333'] }
        },
        legend: { show: false }
    };
    var chart = new ApexCharts(
        document.querySelector("#{{ chart_id|default:'grade-distribution-chart' }}"), options
    );
    chart.render();
})();
</script>
