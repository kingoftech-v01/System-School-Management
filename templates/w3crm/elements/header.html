{% load static %}
<div class="header">
	<div class="header-content">
		<nav class="navbar navbar-expand">
			<div class="collapse navbar-collapse justify-content-between">
				<div class="header-left">
					<form action="{% url 'frontend:search:query' %}" method="GET">
						<div class="input-group search-area">
							<span class="input-group-text"><button type="submit" class="bg-transparent border-0">
								<svg width="19" height="19" viewBox="0 0 19 19" fill="none" xmlns="http://www.w3.org/2000/svg">
								<circle cx="8.786" cy="8.786" r="8.24" stroke="white" stroke-linecap="round" stroke-linejoin="round"/>
								<path d="M14.517 14.945L17.747 18.167" stroke="white" stroke-linecap="round" stroke-linejoin="round"/>
								</svg>
							</button></span>
							<input type="text" name="q" class="form-control" placeholder="Search...">
						</div>
					</form>
				</div>
				<ul class="navbar-nav header-right">
					<!-- Notifications -->
					<li class="nav-item dropdown notification_dropdown">
						<a class="nav-link bell dz-theme-mode" href="javascript:void(0);">
							<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
								<path d="M18 8A6 6 0 106 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
								<path d="M13.73 21a2 2 0 01-3.46 0" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
							</svg>
						</a>
					</li>
					<!-- User Profile Dropdown -->
					<li class="nav-item dropdown header-profile">
						<a class="nav-link" href="javascript:void(0);" role="button" data-bs-toggle="dropdown">
							<div class="header-info ms-3">
								<span class="font-w600">{{ user.get_full_name|default:user.username }}</span>
								<small class="text-end font-w400">{{ user.role|default:"User" }}</small>
							</div>
							<img src="{% static 'w3crm/images/profile/pic1.jpg' %}" width="20" alt="" />
						</a>
						<div class="dropdown-menu dropdown-menu-end">
							<a href="{% url 'frontend:accounts:profile' %}" class="dropdown-item ai-icon">
								<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
								<span class="ms-2">Profile</span>
							</a>
							<a href="{% url 'frontend:accounts:edit_profile' %}" class="dropdown-item ai-icon">
								<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
								<span class="ms-2">Settings</span>
							</a>
							<a href="{% url 'account_logout' %}" class="dropdown-item ai-icon">
								<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
								<span class="ms-2">Logout</span>
							</a>
						</div>
					</li>
				</ul>
			</div>
		</nav>
	</div>
</div>
