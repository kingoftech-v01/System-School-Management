version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: school_db_dev
    environment:
      POSTGRES_DB: school_management_dev
      POSTGRES_USER: school_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_change_me}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_admin -d school_management_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: school_redis_dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/development/Dockerfile
    container_name: school_web_dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume_dev:/app/staticfiles
      - media_volume_dev:/app/media
    ports:
      - "8000:8000"
      - "5678:5678"  # debugpy port
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=School_System.settings.development
      - DATABASE_URL=postgresql://school_admin:${DB_PASSWORD:-dev_password_change_me}@db:5432/school_management_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  celery:
    build:
      context: .
      dockerfile: docker/development/Dockerfile
    container_name: school_celery_dev
    command: celery -A School_System worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=School_System.settings.development
      - DATABASE_URL=postgresql://school_admin:${DB_PASSWORD:-dev_password_change_me}@db:5432/school_management_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: docker/development/Dockerfile
    container_name: school_celery_beat_dev
    command: celery -A School_System beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=School_System.settings.development
      - DATABASE_URL=postgresql://school_admin:${DB_PASSWORD:-dev_password_change_me}@db:5432/school_management_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build:
      context: .
      dockerfile: docker/development/Dockerfile
    container_name: school_flower_dev
    command: celery -A School_System flower --port=5555
    volumes:
      - .:/app
    ports:
      - "5555:5555"
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=School_System.settings.development
      - DATABASE_URL=postgresql://school_admin:${DB_PASSWORD:-dev_password_change_me}@db:5432/school_management_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      - celery
      - redis

volumes:
  postgres_data_dev:
  static_volume_dev:
  media_volume_dev:
