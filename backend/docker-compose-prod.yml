version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: school_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME:-school_management}
      POSTGRES_USER: ${DB_USER:-school_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - school_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-school_admin} -d ${DB_NAME:-school_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: school_redis_prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    networks:
      - school_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    container_name: school_web_prod
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120 --access-logfile - --error-logfile - School_System.wsgi:application
    volumes:
      - static_volume_prod:/app/staticfiles
      - media_volume_prod:/app/media
      - logs_volume:/app/logs
    expose:
      - "8000"
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=School_System.settings.production
      - DATABASE_URL=postgresql://${DB_USER:-school_admin}:${DB_PASSWORD}@db:5432/${DB_NAME:-school_management}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SECURE_SSL_REDIRECT=True
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - school_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: school_nginx_prod
    volumes:
      - ./docker/production/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume_prod:/app/staticfiles:ro
      - media_volume_prod:/app/media:ro
      - ./docker/production/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    networks:
      - school_network
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    container_name: school_celery_prod
    command: celery -A School_System worker -l info --concurrency=4
    volumes:
      - logs_volume:/app/logs
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=School_System.settings.production
      - DATABASE_URL=postgresql://${DB_USER:-school_admin}:${DB_PASSWORD}@db:5432/${DB_NAME:-school_management}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - school_network
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    container_name: school_celery_beat_prod
    command: celery -A School_System beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - logs_volume:/app/logs
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=School_System.settings.production
      - DATABASE_URL=postgresql://${DB_USER:-school_admin}:${DB_PASSWORD}@db:5432/${DB_NAME:-school_management}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - school_network
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    container_name: school_flower_prod
    command: celery -A School_System flower --port=5555 --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    expose:
      - "5555"
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=School_System.settings.production
      - DATABASE_URL=postgresql://${DB_USER:-school_admin}:${DB_PASSWORD}@db:5432/${DB_NAME:-school_management}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - celery
      - redis
    networks:
      - school_network
    restart: unless-stopped

networks:
  school_network:
    driver: bridge

volumes:
  postgres_data_prod:
  redis_data_prod:
  static_volume_prod:
  media_volume_prod:
  logs_volume:
