[pytest]
DJANGO_SETTINGS_MODULE = School_System.settings.development
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --strict-markers
    --strict-config
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing:skip-covered
    # --no-cov-on-fail
    --reuse-db

filterwarnings =
    ignore::pytest.PytestUnhandledThreadExceptionWarning

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

testpaths =
    tests
    core
    accounts
    course
    attendance
    payments
    result
    enrollment
    search
    notes
    filieres
    library
    events
    discipline
    monitoring
    quiz
    articles
    notices
    admissions
    alumni
    forums
    certificates
    grading
    analytics
    dailystat
    School_System
